  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0a DRAM 공정 개발<\u002Fh2><p>수율 램프업 과정의 결정, 원인 분석, 담당자 변경 이력을 하나의 흐름으로 확인합니다.<\u002Fp>\n<div class=\"pha-card-metrics\"><span>자료 <b>{{ totalDocs }}건<\u002Fb><\u002Fspan><span>이벤트 <b>{{ eventCount }}개<\u002Fb><\u002Fspan><span>{{ lastUpdateLabel }}<\u002Fspan><\u002Fdiv>\n<div class=\"pha-card-link\">프로젝트 들어가기 <span>→<\u002Fspan><\u002Fdiv>\n<\u002Fbutton>\n<article class=\"pha-project-card\"><div class=\"pha-card-top\"><span class=\"pha-badge\">DRAM · 설계<\u002Fspan><span class=\"pha-muted\">예시<\u002Fspan><\u002Fdiv><h2>DRAM 회로 설계<\u002Fh2><p>설계 변경과 평가 이력을 모으는 프로젝트 자리입니다.<\u002Fp><div class=\"pha-placeholder\">자료 등록 준비 중<\u002Fdiv><\u002Farticle>\n<article class=\"pha-project-card\"><div class=\"pha-card-top\"><span class=\"pha-badge\">HBM · 패키징<\u002Fspan><span class=\"pha-muted\">예시<\u002Fspan><\u002Fdiv><h2>HBM 패키징 개발<\u002Fh2><p>패키징 개발의 의사결정 이력을 모으는 프로젝트 자리입니다.<\u002Fp><div class=\"pha-placeholder\">자료 등록 준비 중<\u002Fdiv><\u002Farticle>\n<article class=\"pha-project-card\"><div class=\"pha-card-top\"><span class=\"pha-badge\">장비 · 공정<\u002Fspan><span class=\"pha-muted\">예시<\u002Fspan><\u002Fdiv><h2>신규 설비 공정 평가<\u002Fh2><p>설비 평가와 조건 변경의 근거를 모으는 프로젝트 자리입니다.<\u002Fp><div class=\"pha-placeholder\">자료 등록 준비 중<\u002Fdiv><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"height: 4px; border-radius: 2px; background: #86868B\"><\u002Fdiv><div style=\"font-size: 13px; color: #6E6E73\"><b style=\"color: #1D1D1F\">초기 lot 분석<\u002Fb> 02–04월<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"height: 4px; border-radius: 2px; background: #86868B\"><\u002Fdiv><div style=\"font-size: 13px; color: #6E6E73\"><b style=\"color: #1D1D1F\">1차 임원 리뷰 이후<\u002Fb> 05–07월<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"height: 4px; border-radius: 2px; background: #86868B\"><\u002Fdiv><div style=\"font-size: 13px; color: #6E6E73\"><b style=\"color: #1D1D1F\">PL 교체·대책 승인<\u002Fb> 07–08월<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"height: 4px; border-radius: 2px; background: #0072C6\"><\u002Fdiv><div style=\"font-size: 13px; color: #0072C6\"><b>후속 과제<\u002Fb> 09월 – 현재<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"background: #FFFFFF; border: 0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.05); padding: 24px 28px; display: flex; gap: 32px; flex-wrap: wrap\">\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #6E6E73\">지금 이 프로젝트는<\u002Fdiv>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; font-weight: 500\">커패시터 쓰러짐과 EUV 결함은 해결되어 줄기에 합류했고, <b style=\"color: #EA002C\">리텐션(수소 어닐)<\u002Fb>과 <b style=\"color: #EA002C\">웨이퍼 엣지 수율<\u002Fb>이 아직 열려 있습니다. 7월에 공정 PL이 교체되었고, 다음 마일스톤은 10.13 3차 임원 리뷰입니다.<\u002Fp>\n<div style=\"font-size: 12px; color: #6E6E73\">{{ lastUpdateLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #6E6E73\">새로 합류했다면 먼저 볼 것<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; counter-reset: pha; display: flex; flex-direction: column; font-size: 15px; line-height: 1.45\">\n<sc-for list=\"{{ startItems }}\" as=\"si\" hint-placeholder-count=\"3\"><li class=\"pha-start-li\"><button type=\"button\" sc-camel-on-click=\"{{ si.pick }}\" style=\"width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 12px 0; margin: 0; font: inherit; color: #1D1D1F; text-align: left; cursor: pointer\"><span class=\"pha-start-n\"><\u002Fspan><span style=\"flex: 1\"><b style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{ si.date }}<\u002Fb> {{ si.title }} <span style=\"color: #6E6E73\">— {{ si.note }}<\u002Fspan><\u002Fspan><span style=\"color: #86868B; font-size: 18px; line-height: 1\">›<\u002Fspan><\u002Fbutton><\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<h2 style=\"margin: 24px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.025em\">주요 흐름 한눈에 보기<\u002Fh2>\n<div style=\"display: inline-flex; gap: 2px; flex-wrap: wrap; padding: 2px; border-radius: 9px; background: rgba(118,118,128,0.12)\">\n<sc-for list=\"{{ ovChips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ chip.pick }}\" aria-pressed=\"{{ chip.pressed }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start\">\n<div style=\"flex: 1 1 600px; min-width: 0; display: flex; flex-direction: column\">\n<sc-for list=\"{{ ovItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; gap: 14px; align-items: stretch\">\n<div style=\"width: 92px; flex-shrink: 0; padding-top: 18px; display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 14px; font-weight: 600\">{{ item.date }}<\u002Fdiv>\n<div style=\"font-size: 12px; color: #6E6E73\">{{ item.phase }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width: 18px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center\">\n<div style=\"width: 2px; height: 20px; background: #D2D2D7\"><\u002Fdiv>\n<div style=\"{{ item.dotStyle }}\"><\u002Fdiv>\n<div style=\"width: 2px; flex-grow: 1; background: #D2D2D7\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 auto; min-width: 0; padding: 8px 0\">\n<button type=\"button\" sc-camel-on-click=\"{{ item.pick }}\" style=\"{{ item.cardStyle }}\">\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n<span style=\"{{ item.tagStyle }}\">\n<sc-if value=\"{{ item.isDecision }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ item.isIssue }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18h.01\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ item.isChange }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n{{ item.tagLabel }}<\u002Fspan>\n<span style=\"font-size: 13px; color: #6E6E73\">{{ item.sourceLabel }}<\u002Fspan>\n<sc-if value=\"{{ item.hasStatus }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ item.statusStyle }}\">{{ item.statusText }}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font-size: 17px; font-weight: 700; line-height: 1.4\">{{ item.title }}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.55; color: #424245\">{{ item.summary }}<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<aside style=\"flex: 1 1 380px; min-width: 0; position: sticky; top: 88px; background: #FFFFFF; border: 0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.05); padding: 24px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n<span style=\"{{ ovSel.tagStyle }}\">{{ ovSel.tagLabel }}<\u002Fspan>\n<span style=\"font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 14px; font-weight: 600\">{{ ovSel.date }}<\u002Fspan>\n<span style=\"font-size: 13px; color: #6E6E73\">{{ ovSel.phase }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 22px; font-weight: 700; line-height: 1.4\">{{ ovSel.title }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #6E6E73\">배경과 맥락<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.7\">{{ ovSel.background }}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #6E6E73\">연결된 흐름<\u002Fdiv>\n<sc-if value=\"{{ ovSel.hasLinks }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{ ovSel.links }}\" as=\"lk\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ lk.pick }}\" style=\"min-height: 44px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; border: 0; border-radius: 12px; background: #F5F5F7; cursor: pointer; color: #1D1D1F\">\n<span style=\"font-size: 12px; color: #6E6E73; width: 52px; flex-shrink: 0\">{{ lk.rel }}<\u002Fspan>\n<span style=\"{{ lk.tagStyle }}\">{{ lk.tagLabel }}<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 500; line-height: 1.4\">{{ lk.date }} · {{ lk.title }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ ovSel.noLinks }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 14px; color: #6E6E73\">이 항목에서 시작되는 흐름입니다.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #6E6E73\">근거 원문 — 눌러서 해당 부분 보기<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{ ovSel.sources }}\" as=\"osrc\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ osrc.open }}\" style=\"min-height: 44px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: #F5F5F7; cursor: pointer; color: #1D1D1F\">\n<span style=\"font-size: 12px; font-weight: 600; color: #424245; background: #E8E8ED; border-radius: 999px; padding: 2px 8px; flex-shrink: 0\">{{ osrc.kindLabel }}<\u002Fspan>\n<span style=\"font-size: 14px; line-height: 1.4; flex-grow: 1\">{{ osrc.title }}<\u002Fspan>\n<span style=\"font-size: 13px; color: #0072C6; font-weight: 600; flex-shrink: 0\">원문 ›<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ ovSel.goGraph }}\" style=\"min-height: 44px; border-radius: 980px; border: 0; background: #0072C6; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer\">히스토리 그래프에서 보기 →<\u002Fbutton>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isIngest }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pha-ingest-layout\">\n<section class=\"pha-surface\"><div class=\"pha-eyebrow\">ADD MATERIAL<\u002Fdiv><h2>새 자료 추가<\u002Fh2><p class=\"pha-muted\">자료 입력 → 분석 초안 확인 → 사용자 승인. 승인 전에는 프로젝트에 반영하지 않습니다.<\u002Fp>\n<div class=\"pha-form-row\"><div><label for=\"ingest-title\">자료 제목<\u002Flabel><input id=\"ingest-title\" value=\"{{ ingestTitle }}\" sc-camel-on-change=\"{{ onIngestTitle }}\" placeholder=\"예: 10/08 수소 어닐 split 평가 회의록\"><\u002Fdiv><div><label for=\"ingest-kind\">자료 유형<\u002Flabel><select id=\"ingest-kind\" value=\"{{ ingestKind }}\" sc-camel-on-change=\"{{ onIngestKind }}\"><option value=\"auto\">자동 판별<\u002Foption><option value=\"mail\">메일<\u002Foption><option value=\"minutes\">회의록<\u002Foption><\u002Fselect><\u002Fdiv><\u002Fdiv>\n<label for=\"ingest-body\">본문 붙여넣기<\u002Flabel><textarea id=\"ingest-body\" value=\"{{ ingestText }}\" sc-camel-on-change=\"{{ onIngestText }}\" placeholder=\"메일 본문 또는 회의록 전문을 붙여넣으세요. 연도를 포함한 날짜가 있으면 함께 추출합니다.\"><\u002Ftextarea>\n<div class=\"pha-upload-bar\"><label class=\"pha-secondary pha-file-button\">파일 불러오기<input type=\"file\" accept=\".txt,.eml,.md,.html,.htm,.csv\" sc-camel-on-change=\"{{ onIngestFile }}\"><\u002Flabel><span class=\"pha-muted\">TXT · EML · MD · HTML · CSV / UTF-8 · 2MB 이하<\u002Fspan><\u002Fdiv>\n<div class=\"pha-note\">이 HTML은 키워드 기반 분석을 사용합니다. PDF·DOCX 및 외부 AI 분석은 연결되어 있지 않습니다.<\u002Fdiv>\n<div class=\"pha-actions\"><button class=\"pha-secondary\" sc-camel-on-click=\"{{ loadExample }}\">가상 예시 채우기<\u002Fbutton><button class=\"pha-primary\" sc-camel-on-click=\"{{ analyzeIngest }}\">분석 초안 만들기<\u002Fbutton><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #E5E5EA\"><button type=\"button\" sc-camel-on-click=\"{{ resetData }}\" style=\"{{ resetBtnStyle }}\">{{ resetLabel }}<\u002Fbutton><span style=\"font-size: 12px; color: #6E6E73\">{{ resetNote }}<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<sc-if value=\"{{ hasAnalysis }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"pha-surface pha-review\"><div class=\"pha-eyebrow\">REVIEW & APPROVE<\u002Fdiv><h2>분석 초안 확인<\u002Fh2><p class=\"pha-muted\">요약·날짜·연결 대상을 확인하고 수정하세요. 가지 상태는 직접 선택했을 때만 변경됩니다.<\u002Fp>\n<label for=\"analysis-title\">이벤트 제목<\u002Flabel><input id=\"analysis-title\" value=\"{{ analysisTitle }}\" sc-camel-on-change=\"{{ onAnalysisTitle }}\">\n<div class=\"pha-form-row\"><div><label for=\"analysis-date\">자료 날짜 · 필수<\u002Flabel><input id=\"analysis-date\" type=\"date\" value=\"{{ analysisDate }}\" sc-camel-on-change=\"{{ onAnalysisDate }}\"><\u002Fdiv><div><label for=\"analysis-kind\">확인한 자료 유형<\u002Flabel><select id=\"analysis-kind\" value=\"{{ analysisKind }}\" sc-camel-on-change=\"{{ onAnalysisKind }}\"><option value=\"mail\">메일<\u002Foption><option value=\"minutes\">회의록<\u002Foption><\u002Fselect><\u002Fdiv><\u002Fdiv>\n<label for=\"analysis-type\">이벤트 유형 · 사용자 확인<\u002Flabel><select id=\"analysis-type\" value=\"{{ analysisEventType }}\" sc-camel-on-change=\"{{ onAnalysisType }}\"><option value=\"change\">변경 / 평가 결과<\u002Foption><option value=\"issue\">쟁점<\u002Foption><option value=\"decision\">결정<\u002Foption><\u002Fselect>\n<label for=\"analysis-match\">연결할 기존 이벤트<\u002Flabel><select id=\"analysis-match\" value=\"{{ analysisMatchId }}\" sc-camel-on-change=\"{{ onAnalysisMatch }}\"><option value=\"\">연결 없이 새 이벤트 생성<\u002Foption><sc-for list=\"{{ matchOptions }}\" as=\"mo\"><option value=\"{{ mo.id }}\">{{ mo.label }}<\u002Foption><\u002Fsc-for><\u002Fselect>\n<div class=\"pha-match-note\"><b>추천 근거<\u002Fb><p>{{ analysisWhy }}<\u002Fp><span>키워드 겹침은 선후관계나 원인관계를 보장하지 않습니다.<\u002Fspan><\u002Fdiv>\n<div class=\"pha-form-row\"><div><label for=\"analysis-branch\">반영할 가지<\u002Flabel><select id=\"analysis-branch\" value=\"{{ analysisBranch }}\" sc-camel-on-change=\"{{ onAnalysisBranch }}\"><option value=\"trunk\">프로젝트 줄기<\u002Foption><sc-for list=\"{{ branchOptions }}\" as=\"bo\"><option value=\"{{ bo.id }}\">{{ bo.label }}<\u002Foption><\u002Fsc-for><\u002Fselect><\u002Fdiv><div><label for=\"analysis-status\">가지 상태 · 직접 확인<\u002Flabel><select id=\"analysis-status\" value=\"{{ analysisBranchStatus }}\" sc-camel-on-change=\"{{ onAnalysisStatus }}\"><option value=\"keep\">현재 상태 유지<\u002Foption><option value=\"active\">진행 중<\u002Foption><option value=\"open\">미해결<\u002Foption><option value=\"merged\">해결 · 합류<\u002Foption><\u002Fselect><\u002Fdiv><\u002Fdiv>\n<label for=\"analysis- abel for=\"pha-chat-input\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\">질문 입력<\u002Flabel>\n<input id=\"pha-chat-input\" type=\"text\" autocomplete=\"off\" value=\"{{ chatInput }}\" sc-camel-on-change=\"{{ onChatInput }}\" sc-camel-on-key-down=\"{{ onChatKey }}\" placeholder=\"프로젝트에 대해 물어보세요\" style=\"flex-grow: 1; min-width: 0; min-height: 44px; padding: 0 14px; border-radius: 980px; border: 0; font-size: 14px; font-family: inherit; color: #1D1D1F; background: #F2F2F7\">\n<button type=\"button\" sc-camel-on-click=\"{{ sendChat }}\" aria-label=\"보내기\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 980px; border: none; background: #0072C6; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleChat }}\" aria-label=\"{{ fabLabel }}\" style=\"width: 60px; height: 60px; border-radius: 50%; border: none; background: #0072C6; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px -8px rgba(0,114,198,0.55)\">\n<sc-if value=\"{{ chatClosed }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M10 3.5 11.9 9.1 17.5 11 11.9 12.9 10 18.5 8.1 12.9 2.5 11 8.1 9.1Z\"><\u002Fpath><path d=\"M18.5 2 19.4 4.6 22 5.5 19.4 6.4 18.5 9 17.6 6.4 15 5.5 17.6 4.6Z\"><\u002Fpath><path d=\"M18 15 18.7 16.8 20.5 17.5 18.7 18.2 18 20 17.3 18.2 15.5 17.5 17.3 16.8Z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let saved={docs:[],events:[],branches:{}};\n    try { const raw=localStorage.getItem('pha_d0a_updates_v2'); if(raw){ const obj=JSON.parse(raw); if(Array.isArray(obj.docs)&&Array.isArray(obj.events))saved=obj; } } catch(e) {}\n    this.state = { addedDocs:saved.docs, addedEvents:saved.events, branchUpdates:saved.branches||{}, ingestTitle:'', ingestKind:'auto', ingestText:'', ingestAnalysis:null, appliedMessage:'', lastApplied:null, screen: 'overview', prev: 'graph', exp: {}, hl: null, panel: { kind: 'event', id: 't4' }, docId: null, focus: null, libKind: 'all', libTopic: 'all', chatOpen: false, chatInput: '', chat: [{ role: 'bot', kind: 'welcome' }], typing: false };\n    this.bodyEl = null;\n    this.lastUserEl = null;\n    this.timer = null;\n    this.scrollToUser = false;\n  }\n  componentDidUpdate() {\n    if (this.scrollToUser && this.bodyEl && this.lastUserEl) {\n      this.scrollToUser = false;\n      this.bodyEl.scrollTop = Math.max(0, this.lastUserEl.offsetTop - 12);\n    }\n  }\n  componentWillUnmount() { clearTimeout(this.timer); }\n\n  persistUserData(docs, events, branches) {\n    try {\n      localStorage.setItem('pha_d0a_updates_v2', JSON.stringify({docs, events, branches}));\n      return true;\n    } catch (e) { return false; }\n  }\n  resetUserData() {\n    if (!this.state.resetArm) { this.setState({ resetArm: true }); return; }\n    try { localStorage.removeItem('pha_d0a_updates_v2'); } catch (e) {}\n    this.setState({ addedDocs: [], addedEvents: [], branchUpdates: {}, resetArm: false, ingestAnalysis: null, lastApplied: null, panel: { kind: 'event', id: 't4' }, exp: {}, hl: null, appliedMessage: '테스트로 추가한 자료를 모두 지웠습니다. 기본 시연 데이터만 남았습니다.' });\n  }\n  editIngest(key, value) { this.setState({[key]:value, ingestAnalysis:null, appliedMessage:''}); }\n  topicGroups() {\n    return [\n      {name:'커패시터',terms:['커패시터','capacitor','storage node','쓰러짐','leaning','bowing','지지막','bias pulsing','c4f6','ipa','건조']},\n      {name:'EUV',terms:['euv','미개구','노광','dose','pr 두께','opc','e-beam','브리지']},\n      {name:'리텐션',terms:['리텐션','retention','tail bit','recess','bwl','cmp','etch-back','수소','어닐','anneal']},\n      {name:'엣지',terms:['엣지','edge','막두께','cvd','식각 균일도','분리 실험']},\n      {name:'인수인계',terms:['인수인계','담당자','전임','pl 교체','누락']},\n      {name:'일정',terms:['일정','리뷰','양산','이관','마일스톤']}\n    ];\n  }\n  parseMaterialDate(text) {\n    const m=String(text).match(/\\b(20\\d{2})[.\\/-](\\d{1,2})[.\\/-](\\d{1,2})\\b/);\n    if (!m) return '';\n    const date=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');\n    const d=new Date(date+'T00:00:00Z');\n    return !isNaN(d) && d.toISOString().slice(0,10)===date ? date : '';\n  }\n  analyzeIncomingMaterial() {\n    const raw=this.state.ingestText.trim();\n    if (!raw) { this.setState({appliedMessage:'본문을 붙여넣거나 파일을 불러온 뒤 분석해 주세요.'}); return; }\n    const title=this.state.ingestTitle.trim() || '사용자 추가 자료';\n    const input=(title+'\\n'+raw).toLowerCase();\n    const {BR,E,D}=this.data();\n    const groups=this.topicGroups();\n    const present=groups.filter(g=>g.terms.some(t=>input.includes(t)));\n    let kind=this.state.ingestKind;\n    if(kind==='auto') kind=/회의록|참석자|안건|결정 사항|action item/i.test(input)?'minutes':'mail';\n    const candidates=E.filter(e=>!e.planned).map(e=>{\n      const context=(e.title+' '+e.sub+' '+(BR[e.br]?BR[e.br].name:'')+' '+e.src.map(id=>D[id].title).join(' ')).toLowerCase();\n      const hits=[];\n      present.forEach(g=>g.terms.forEach(t=>{if(input.includes(t)&&context.includes(t)&&!hits.includes(t))hits.push(t);}));\n      return {id:e.id,title:e.date+' · '+e.title,date:e.fullDate||'2026-'+e.date.replace('.','-'),hits,score:hits.length};\n    }).filter(c=>c.score>0).sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date)).slice(0,5);\n    const best=candidates[0];\n    const lines=raw.split(/\\n/).map(s=>s.trim().replace(/^[-•]\\s*/, '')).filter(s=>s.length>=8&&!/^20\\d{2}[.\\/-]\\d/.test(s)&&!/^(참석자|작성자|수신|발신|일시|제목|subject|from|to|date)\\s*[:：]/i.test(s));\n    const facts=lines.filter(s=>present.some(g=>g.terms.some(t=>s.toLowerCase().includes(t)))).slice(0,4);\n    const summary=(facts.length?facts:lines).slice(0,2).join(' / ').slice(0,500)||raw.slice(0,500);\n    // Text extraction proposes a draft; the reviewer explicitly selects the event type and branch status.\n    const followup=/후속|재평가|재검증|split 결과|반영 후|변경 후/i.test(input);\n    this.setState({ingestAnalysis:{title,raw,sourceTitle:title,date:this.parseMaterialDate(title+'\\n'+raw),kind,\n      eventType:'change',summary,facts:(facts.length?facts:lines.slice(0,3)),topics:present.map(g=>g.name),\n      candidates,matchId:best?best.id:'',branch:best?E.find(e=>e.id===best.id).br:'trunk',branchStatus:'keep',\n      mode:best?(followup?'followup':'merge'):'followup'},appliedMessage:''});\n  }\n  changeAnalysis(key,value) {\n    const a=Object.assign({},this.state.ingestAnalysis,{[key]:value});\n    if(key==='matchId') {\n      const e=this.data().E.find(e=>e.id===value);\n      if(e)a.branch=e.br;\n      if(!value)a.mode='followup';\n      a.branchStatus='keep';\n    }\n    if(key==='branch')a.branchStatus='keep';\n    this.setState({ingestAnalysis:a,appliedMessage:''});\n  }\n  readIncomingFile(event) {\n    const file=event.target.files && event.target.files[0];\n    if(!file)return;\n    if(!/\\.(txt|eml|md|html?|csv)$/i.test(file.name)) {this.setState({appl ansform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.06),0 18px 44px rgba(0,0,0,.10)}.pha-sp-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.pha-sp-project-title{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-bottom:8px}.pha-sp-project-sub{font-size:15px;color:#6e6e73;line-height:1.5}.pha-sp-status{flex-shrink:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;background:rgba(0,114,198,.1);color:#0072C6;border:0}.pha-sp-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;padding-top:20px;border-top:.5px solid rgba(0,0,0,.1)}.pha-sp-meta-k{font-size:12px;color:#86868b;margin-bottom:4px;font-weight:500}.pha-sp-meta-v{font-size:15px;font-weight:600;color:#1d1d1f;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pha-sp-empty{display:none;padding:26px 28px;border:0;border-radius:20px;background:#fff;color:#6e6e73;font-size:14px;line-height:1.6}.pha-sp-empty.show{display:block}.pha-sp-footer{margin-top:72px;padding-top:20px;border-top:.5px solid rgba(0,0,0,.12);color:#86868b;font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}#pha-back-to-search{position:fixed;left:20px;bottom:20px;z-index:2147481000;height:40px;padding:0 16px;border-radius:980px;border:0;background:rgba(251,251,253,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.12);font-size:13px;font-weight:500;color:#1d1d1f;cursor:pointer;display:none;font-family:inherit}#pha-back-to-search:hover{background:#fff}@media(max-width:760px){.pha-sp-header{padding:0 20px}.pha-sp-sub{display:none}.pha-sp-main{padding:58px 18px 60px}.pha-sp-title{font-size:38px}.pha-sp-search{height:62px;font-size:16px}.pha-sp-meta{grid-template-columns:repeat(2,minmax(0,1fr))}.pha-sp-row{flex-direction:column}.pha-sp-status{align-self:flex-start}}\n<\u002Fstyle>\n<style>#pha-search-portal{font-family:-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Apple SD Gothic Neo\", \"Pretendard Variable\", Pretendard, \"Segoe UI\", sans-serif}<\u002Fstyle>\n<div id=\"pha-search-portal\" role=\"dialog\" aria-label=\"PHA 프로젝트 검색\"><header class=\"pha-sp-header\"><div class=\"pha-sp-brand\"><div class=\"pha-sp-logo\">PHA<\u002Fdiv><span>Project History Agent<\u002Fspan><\u002Fdiv><div class=\"pha-sp-sub\">흩어진 메일 · 회의록 · 보고서를 프로젝트 흐름으로<\u002Fdiv><\u002Fheader><main class=\"pha-sp-main\"><div class=\"pha-sp-eyebrow\">PROJECT SEARCH<\u002Fdiv><h1 class=\"pha-sp-title\">어떤 프로젝트의 History를 찾으시나요?<\u002Fh1><div class=\"pha-sp-desc\">공정명, 개발 과제, 이슈 또는 키워드를 입력하세요. 관련 프로젝트를 찾아 히스토리와 근거 자료를 바로 열어드립니다.<\u002Fdiv><div class=\"pha-sp-search-wrap\"><input id=\"pha-project-search\" class=\"pha-sp-search\" type=\"search\" autocomplete=\"off\" placeholder=\"예: D0a DRAM 공정 개발 · 리텐션 · 엣지 수율\" aria-label=\"프로젝트 검색\"><svg class=\"pha-sp-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"pha-sp-hint\"><span>빠른 검색<\u002Fspan><button class=\"pha-sp-chip\" data-q=\"D0a DRAM\">D0a DRAM<\u002Fbutton><button class=\"pha-sp-chip\" data-q=\"수율 램프업\">수율 램프업<\u002Fbutton><button class=\"pha-sp-chip\" data-q=\"리텐션\">리텐션<\u002Fbutton><button class=\"pha-sp-chip\" data-q=\"엣지 수율\">엣지 수율<\u002Fbutton><\u002Fdiv><section class=\"pha-sp-section\"><div class=\"pha-sp-section-head\"><div class=\"pha-sp-section-title\">검색 결과<\u002Fdiv><div id=\"pha-sp-count\" class=\"pha-sp-count\">검색어를 입력하세요<\u002Fdiv><\u002Fdiv><button id=\"pha-project-card\" class=\"pha-sp-card\" type=\"button\"><div class=\"pha-sp-row\"><div><div class=\"pha-sp-project-title\">D0a DRAM 공정 개발 — 수율 램프업 과제<\u002Fdiv><div class=\"pha-sp-project-sub\">커패시터 쓰러짐, EUV 결함, 리텐션 및 웨이퍼 엣지 수율의 원인 분석과 의사결정, 담당자 변경을 이어 보는 프로젝트 History<\u002Fdiv><\u002Fdiv><div class=\"pha-sp-status\">수율 램프업<\u002Fdiv><\u002Fdiv><div class=\"pha-sp-meta\"><div><div class=\"pha-sp-meta-k\">Process<\u002Fdiv><div class=\"pha-sp-meta-v\">D0a · 가상 공정 코드<\u002Fdiv><\u002Fdiv><div><div class=\"pha-sp-meta-k\">Project<\u002Fdiv><div class=\"pha-sp-meta-v\">DRAM 공정 개발<\u002Fdiv><\u002Fdiv><div><div class=\"pha-sp-meta-k\">Focus<\u002Fdiv><div class=\"pha-sp-meta-v\">수율 램프업<\u002Fdiv><\u002Fdiv><div><div class=\"pha-sp-meta-k\">Updated<\u002Fdiv><div id=\"pha-sp-updated\" class=\"pha-sp-meta-v\">2026.09.16<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fbutton><div id=\"pha-sp-empty\" class=\"pha-sp-empty\">일치하는 프로젝트가 없습니다. <b>공정명(D0a)<\u002Fb>, <b>개발 과제(DRAM)<\u002Fb>, <b>이슈(리텐션, EUV, 엣지 수율)<\u002Fb>처럼 핵심 키워드로 다시 검색해보세요.<\u002Fdiv><\u002Fsection><div class=\"pha-sp-footer\"><span>PHA · Project History Agent<\u002Fspan><span>등록된 메일 · 회의록 · 보고서를 기반으로 구성됩니다.<\u002Fspan><\u002Fdiv><\u002Fmain><\u002Fdiv><button id=\"pha-back-to-search\" type=\"button\">⌕ 프로젝트 검색<\u002Fbutton>\n<script>(function(){\n  function norm(v){return(v||'').toLowerCase().replace(/\\bd\\s*0\\s*a\\b/g,'d0a').replace(/[^a-z0-9가-힣]+/g,' ').trim()}\n  var corpus=norm('d0a d0a-dram dram 디램 공정 개발 수율 램프업 yield ramp up 커패시터 쓰러짐 capacitor storage node sn leaning bowing 지지막 건조 euv 확률적 결함 노광 dose opc e-beam 리텐션 retention tail bit bwl recess cmp 수소 어닐 anneal 웨이퍼 엣지 edge 막두께 cvd 식각 균일도 인수인계 담당자 변경 pl');\n  var portal=document.getElementById('pha-search-portal'),input=document.getElementById('pha-project-search'),card=document.getElementById('pha-project-card'),empty=document.getElementById('pha-sp-empty'),count=document.getElementById('pha-sp-count'),back=document.getElementById('pha-back-to-search');\n  function syncUpdated(){\n    var date='2026-09-16';\n    try{var data=JSON.parse(localStorage.getItem('pha_d0a_updates_v2')||'{}');(data.docs||[]).forEach(function(r){if(r.data&&r.data.fullDate&&r.data.fullDate>date)date=r.data.fullDate})}catch(e){}\n    document.getElementById('pha-sp-updated').textContent=date.replace(/-/g,'.');\n  }\n  function search(){\n    var q=norm(input.value);syncUpdated();\n    if(!q){card.classList.remove('show');empty.classList.remove('show');count.textContent='검색어를 입력하세요';return}\n    var toks=q.split(/\\s+/).filter(Boolean),hits=toks.filter(function(x){return corpus.split(' ').some(function(word){return word.indexOf(x)>=0})}).length;\n    var ok=hits>0&&(hits/toks.length>=.45||/\\bd0a\\b|\\bdram\\b|디램/.test(q));\n    card.classList.toggle('show',ok);empty.classList.toggle('show',!ok);count.textContent=ok?'1개 프로젝트':'0개 프로젝트';\n  }\n  function openProject(){portal.style.display='none';back.style.display='block';window.scrollTo(0,0)}\n  function openSearch(){portal.style.display='block';back.style.display='none';input.focus();search()}\n  input.addEventListener('input',search);\n  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();search();if(card.classList.contains('show'))openProject()}});\n  card.addEventListener('click',openProject);back.addEventListener('click',openSearch);\n  window.addEventListener('pha:open-search',openSearch);\n  document.querySelectorAll('.pha-sp-chip').forEach(function(b){b.addEventListener('click',function(){input.value=b.getAttribute('data-q')||'';search();input.focus()})});\n  syncUpdated();setTimeout(function(){input.focus()},50);\n})();<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
</script>
